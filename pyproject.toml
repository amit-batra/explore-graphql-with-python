[project]
name = "explore-graphql-with-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amit Batra", email = "amit.batra@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "ariadne>=0.21",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
explore-graphql-with-python = "explore_graphql_with_python:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
